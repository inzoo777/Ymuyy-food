<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Flappy Bird Night & Snow</title>
  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050510;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .game-container {
      position: relative;
      display: inline-block;
    }
    canvas {
      background: #0b1d3a;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
      display: block;
    }
    /* Splash & Pause Overlay */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(11, 29, 58, 0.9);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 15px;
      z-index: 10;
      color: #fff;
    }
    .overlay h1 {
      font-size: 28px;
      margin-bottom: 10px;
      text-shadow: 0 0 10px #70a1ff;
    }
    .btn {
      padding: 12px 36px;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      width: 180px;
      text-align: center;
      transition: transform 0.1s, opacity 0.2s;
    }
    .btn-play { background: #2ed573; box-shadow: 0 4px 15px rgba(46, 213, 115, 0.4); }
    .btn-resume { background: #1e90ff; box-shadow: 0 4px 15px rgba(30, 144, 255, 0.4); }
    .btn-exit { background: #ff4757; box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4); }
    .btn:active { transform: scale(0.95); opacity: 0.9; }

    /* Pause Button in Game */
    #pause-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      width: 40px;
      height: 40px;
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid #fff;
      border-radius: 50%;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 5;
    }
  </style>
</head>
<body>

<div class="game-container">
  <canvas id="canvas"></canvas>

  <!-- Pause UI Button -->
  <button id="pause-btn">❚❚</button>

  <!-- Splash Screen -->
  <div id="splash-screen" class="overlay">
    <h1>Flappy Winter</h1>
    <button id="play-btn" class="btn btn-play">PLAY</button>
  </div>

  <!-- Pause Screen -->
  <div id="pause-screen" class="overlay" style="display: none;">
    <h1>PAUSED</h1>
    <button id="resume-btn" class="btn btn-resume">RESUME</button>
    <button id="exit-btn-pause" class="btn btn-exit">EXIT</button>
  </div>
</div>

<script>
const cvs = document.getElementById("canvas");
const ctx = cvs.getContext("2d");

const splashScreen = document.getElementById("splash-screen");
const pauseScreen = document.getElementById("pause-screen");
const pauseBtn = document.getElementById("pause-btn");

const playBtn = document.getElementById("play-btn");
const resumeBtn = document.getElementById("resume-btn");
const exitBtnPause = document.getElementById("exit-btn-pause");

function resizeCanvas() {
  const windowRatio = window.innerWidth / window.innerHeight;
  const gameRatio = 320 / 480;

  if (windowRatio < gameRatio) {
    cvs.width = window.innerWidth;
    cvs.height = window.innerWidth / gameRatio;
  } else {
    cvs.height = window.innerHeight;
    cvs.width = window.innerHeight * gameRatio;
  }
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

function getScale() {
  return cvs.width / 320;
}

let frames = 0;

// Snowflakes Setup
const snowflakes = [];
for (let i = 0; i < 40; i++) {
  snowflakes.push({
    x: Math.random() * 320,
    y: Math.random() * 480,
    r: Math.random() * 2 + 1,
    speed: Math.random() * 1 + 0.5
  });
}

// Stars Setup
const stars = [];
for (let i = 0; i < 30; i++) {
  stars.push({
    x: Math.random() * 320,
    y: Math.random() * 300,
    r: Math.random() * 1.5
  });
}

// Bird Object
const bird = {
  x: 50,
  y: 150,
  radius: 12,
  gravity: 0.25,
  jump: 4.6,
  speed: 0,
  
  draw: function() {
    const scale = getScale();
    ctx.fillStyle = "#FFD700";
    ctx.beginPath();
    ctx.arc(this.x * scale, this.y * scale, this.radius * scale, 0, Math.PI * 2);
    ctx.fill();
    ctx.closePath();
  },
  
  flap: function() {
    this.speed = -this.jump;
  },
  
  update: function() {
    this.speed += this.gravity;
    this.y += this.speed;
    
    if(this.y + this.radius >= 430) {
      this.y = 430 - this.radius;
      gameOver();
    }
    
    if(this.y - this.radius <= 0) {
      this.y = this.radius;
      this.speed = 0;
    }
  },
  
  reset: function() {
    this.y = 150;
    this.speed = 0;
  }
};

// Pipes Object
const pipes = {
  position: [],
  top: { minY: -260, maxY: -120 },
  gap: 120,
  w: 40,
  dx: 2,
  
  draw: function() {
    const scale = getScale();
    for(let i = 0; i < this.position.length; i++) {
      let p = this.position[i];
      let topYPos = p.y * scale;
      let bottomYPos = (p.y + 300 + this.gap) * scale;
      
      ctx.fillStyle = "#1b4d3e";
      ctx.fillRect(p.x * scale, topYPos, this.w * scale, 300 * scale);
      ctx.fillRect(p.x * scale, bottomYPos, this.w * scale, 300 * scale);

      ctx.fillStyle = "#FFF";
      ctx.fillRect(p.x * scale, (p.y + 300 - 6) * scale, this.w * scale, 6 * scale);
      ctx.fillRect(p.x * scale, bottomYPos, this.w * scale, 6 * scale);
    }
  },
  
  update: function() {
    if(frames % 100 === 0) {
      this.position.push({
        x: 320,
        y: Math.floor(Math.random() * (this.top.maxY - this.top.minY + 1) + this.top.minY)
      });
    }
    
    for(let i = 0; i < this.position.length; i++) {
      let p = this.position[i];
      p.x -= this.dx;
      
      let bottomPipeY = p.y + 300 + this.gap;
      
      if(bird.x + bird.radius > p.x && bird.x - bird.radius < p.x + this.w &&
         bird.y - bird.radius < p.y + 300) {
        gameOver();
      }
      if(bird.x + bird.radius > p.x && bird.x - bird.radius < p.x + this.w &&
         bird.y + bird.radius > bottomPipeY) {
        gameOver();
      }
      
      if(p.x + this.w < bird.x - bird.radius && !p.passed) {
        score.value += 1;
        p.passed = true;
      }
      
      if(p.x + this.w <= 0) {
        this.position.shift();
      }
    }
  },
  
  reset: function() {
    this.position = [];
  }
};

// Ground Object
const ground = {
  draw: function() {
    const scale = getScale();
    ctx.fillStyle = "#e0e6ed";
    ctx.fillRect(0, 430 * scale, cvs.width, 50 * scale);
  }
};

// Score Object
const score = {
  value: 0,
  draw: function() {
    const scale = getScale();
    ctx.fillStyle = "#FFF";
    ctx.strokeStyle = "#000";
    ctx.lineWidth = 2 * scale;
    ctx.font = `${30 * scale}px sans-serif`;
    ctx.fillText(this.value, cvs.width / 2 - (10 * scale), 50 * scale);
    ctx.strokeText(this.value, cvs.width / 2 - (10 * scale), 50 * scale);
  },
  reset: function() {
    this.value = 0;
  }
};

let state = { current: 0, splash: 0, game: 1, pause: 2, gameOver: 3 };

function gameOver() {
  state.current = state.gameOver;
  pauseBtn.style.display = "none";
}

// Control Event Listeners
playBtn.addEventListener("click", () => {
  splashScreen.style.display = "none";
  pauseBtn.style.display = "flex";
  bird.reset();
  pipes.reset();
  score.reset();
  state.current = state.game;
});

pauseBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  if (state.current === state.game) {
    state.current = state.pause;
    pauseScreen.style.display = "flex";
    pauseBtn.style.display = "none";
  }
});

resumeBtn.addEventListener("click", () => {
  pauseScreen.style.display = "none";
  pauseBtn.style.display = "flex";
  state.current = state.game;
});

exitBtnPause.addEventListener("click", () => {
  pauseScreen.style.display = "none";
  splashScreen.style.display = "flex";
  pauseBtn.style.display = "none";
  state.current = state.splash;
});

// Controls for gameplay
function handleInput(e) {
  // Prevent flapping when clicking buttons
  if (e.target.tagName === "BUTTON") return;
  
  if (state.current === state.game) {
    if (e) e.preventDefault();
    bird.flap();
  } else if (state.current === state.gameOver) {
    if (e) e.preventDefault();
    bird.reset();
    pipes.reset();
    score.reset();
    pauseBtn.style.display = "flex";
    state.current = state.game;
  }
}

window.addEventListener("touchstart", handleInput, { passive: false });
window.addEventListener("mousedown", handleInput);

// Dynamic Animations
function drawEnvironment() {
  const scale = getScale();
  
  ctx.fillStyle = "#FFF";
  stars.forEach(s => {
    ctx.beginPath();
    ctx.arc(s.x * scale, s.y * scale, s.r * scale, 0, Math.PI * 2);
    ctx.fill();
  });

  snowflakes.forEach(f => {
    ctx.beginPath();
    ctx.arc(f.x * scale, f.y * scale, f.r * scale, 0, Math.PI * 2);
    ctx.fill();

    // Only move snow when not paused
    if (state.current !== state.pause) {
      f.y += f.speed;
      if (f.y > 480) {
        f.y = 0;
        f.x = Math.random() * 320;
      }
    }
  });
}

function draw() {
  const scale = getScale();
  
  ctx.fillStyle = "#0b1d3a";
  ctx.fillRect(0, 0, cvs.width, cvs.height);
  
  drawEnvironment();
  pipes.draw();
  ground.draw();
  bird.draw();
  score.draw();
  
  if(state.current === state.gameOver) {
    ctx.fillStyle = "#e74c3c";
    ctx.font = `${22 * scale}px sans-serif`;
    ctx.fillText("GAME OVER", cvs.width/2 - (65 * scale), cvs.height/2);
    ctx.fillStyle = "#FFF";
    ctx.font = `${14 * scale}px sans-serif`;
    ctx.fillText("Tap to Restart", cvs.width/2 - (45 * scale), cvs.height/2 + (30 * scale));
  }
}

function update() {
  if(state.current === state.game) {
    bird.update();
    pipes.update();
  }
}

function loop() {
  update();
  draw();
  if (state.current !== state.pause) {
    frames++;
  }
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
